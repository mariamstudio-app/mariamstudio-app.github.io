.brand{flex:0 0 auto;display:inline-flex}

const DB='mariam-local',idb=()=>new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kv=async(m,k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv');const q=m==='get'?t.get(k):m==='del'?t.delete(k):t.put(v,k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
const b64=blob=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.readAsDataURL(blob)});
const rid=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const LS={
 async getApp(){let s=await kv('get','state');if(!s){s=JSON.parse(JSON.stringify(INIT));s.created=new Date().toISOString();await kv('put','state',s)}return s},
 async saveApp(rev,next){const cur=await LS.getApp();if(cur.revision!==rev)throw new Error('النسخة اتغيرت، اضغطي تحديث');await kv('put','prev',cur);next.revision=rev+1;next.updated=new Date().toISOString();await kv('put','state',next);return next},
 async restorePrevious(rev){const cur=await LS.getApp(),p=await kv('get','prev');if(!p)throw new Error('مفيش نسخة سابقة');p.revision=cur.revision+1;await kv('put','state',p);return p},
 async getMedia(id){const m=await kv('get','media:'+id);if(!m)throw new Error('الملف مش موجود على الجهاز');return {name:m.name,type:m.type,data:await b64(m.blob)}},
 async uploadAsset(form){const f=new FormData(form),file=f.get('file'),kind=f.get('kind');const cur=await LS.getApp();const id=rid();await kv('put','media:'+id,{name:file.name,type:file.type,blob:file});const next=JSON.parse(JSON.stringify(cur));const rec={id,type:file.type,name:file.name,size:file.size,created:new Date().toISOString()};if(kind==='work')next.works.push({...rec,category:f.get('category'),title:f.get('title'),note:f.get('note')||''});else next.assets[kind]=rec;return LS.saveApp(cur.revision,next)},
 async exportApp(){const st=await LS.getApp(),media={};const ids=[...Object.values(st.assets||{}),...(st.works||[])].map(x=>x.id).concat(st.assets?.notebook?.pages||[]);for(const id of ids){try{media[id]=await LS.getMedia(id)}catch(e){}}await kv('put','lastBackup',Date.now());return {state:st,media}}
};

function render(){if(!state)return;day();$('app').style.animation='none';$('app').innerHTML=datebar()+view();void $('app').offsetWidth;$('app').style.animation='';$('nav').innerHTML=[['home','home','الرئيسية'],['today','sun','يومي'],['worship','moon','علاقتي بربنا'],['works','art','أعمالي'],['more','more','مساحتي']].map(([r,i,n])=>'<button data-go="'+r+'" class="'+(route===r?'active':'')+'">'+icon(i)+n+'</button>').join('');bind();hydrate();quickStatus();}

function on(id,fn){if($(id))$(id).onclick=fn}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>b.dataset.section==='worship'?go('worship'):go('section',b.dataset.section));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>quickToggle('day',b.dataset.toggle));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTask(b.dataset.edit));document.querySelectorAll('[data-wtab]').forEach(b=>b.onclick=()=>go('worship',b.dataset.wtab));document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>quickToggle('plan',b.dataset.plan));document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>go('works',b.dataset.cat));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMedia(b.dataset.open));document.querySelectorAll('[data-link-notebook]').forEach(b=>b.onclick=linkNotebook);document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>course(b.dataset.course));document.querySelectorAll('[data-work-edit]').forEach(b=>b.onclick=()=>editWork(b.dataset.workEdit));document.querySelectorAll('[data-work-del]').forEach(b=>b.onclick=()=>{if(confirm('ننقل العمل لسلة الاسترجاع؟'))save(s=>{let i=s.works.findIndex(x=>x.id===b.dataset.workDel);s.trash.push({kind:'work',value:s.works.splice(i,1)[0],at:new Date().toISOString()})})});if($('date'))$('date').onchange=e=>{date=e.target.value;render()};on('saveReflection',()=>{let v=$('reflection').value;save(s=>day(s).note=v)});on('savePages',()=>{let v=$('pages').value;save(s=>day(s).pages=v)});on('saveCare',()=>{let v=$('care').value;save(s=>s.care=v)});on('saveRhythm',()=>{let v=$('rhythm').value;save(s=>s.rhythm=v)});on('addTask',()=>editTask());on('addWorship',()=>editTask(null,'worship'));on('saveReading',()=>{let b=$('book').value,p=$('lastpage').value;save(s=>{s.reading.book=b;s.reading.page=p})});on('addCourse',()=>{let n=prompt('اسم الكورس أو المهارة');i function editTask(id,sec){let it=state.items.find(x=>x.id===id)||{name:'',section:sec||(route==='section'?sub:'learn'),part:'مرن',cadence:'يومي'};modal('<h2>'+ (id?'تعديل المتابعة':'مهمة على مقاسك')+'</h2><label>الاسم<input id="tn" value="'+esc(it.name)+'"></label><div class="fieldgrid"><label>القسم<select id="ts">'+state.sections.map(s=>'<option value="'+s.id+'" '+(it.section===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label><label>وقت مرن<select id="tp">'+['صبح','بعد الظهر','بليل','مرن'].map(p=>'<option '+(it.part===p?'selected':'')+'>'+p+'</option>').join('')+'</select></label></div><label>التكرار / ملاحظة<input id="tc" value="'+esc(it.cadence)+'"></label><label class="row"><input id="tf" type="checkbox" style="width:22px" '+(it.hideFriday?'checked':'')+'> أخفيها يوم الجمعة</label><div class="actions"><button id="taskSave">حفظ</button>'+(id?'<button class="line danger" id="taskRemove">إزالة مع إمكانية الاسترجاع</button>':'')+'</div>');on('taskSave',async()=>{let n=$('tn').value.trim();if(!n)return;let v={id:id||'i'+Date.now(),name:n,section:$('ts').value,part:$('tp').value,cadence:$('tc').value,hideFriday:$('tf').checked};if(await save(s=>{if(id)s.items[s.items.findIndex(x=>x.id===id)]=v;else s.items.push(v)}))$('modal').close()});on('taskRemove',async()=>{if(await save(s=>{let i=s.items.findIndex(x=>x.id===id);s.trash.push({kind:'item',value:s.items.splice(i,1)[0],at:new Date().toISOString()})}))$('modal').close()});}

function linkNotebook(){const u=(prompt('الصقي رابط دفتر الحفظ والتثبيت (رابط Google Drive)')||'').trim();if(!u)return;let ok=false;try{const h=new URL(u).hostname;ok=/(^|\.)(drive|docs)\.google\.com$/.test(h)}catch(e){}if(!ok){toast('ده مش رابط Google Drive');return}const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);save(v=>{v.assets.notebook={type:'application/pdf',name:'دفتر حفظ وتثبيت القرآن',size:0,created:new Date().toISOString(),id:m?m[1]:'nb'+Date.now(),url:u}}).then(()=>toast('تم ربط الدفتر')).catch(e=>toast(e.message))}
async function openMedia(id){let a=Object.values(state.assets).concat(state.works).find(x=>x.id===id);if(!a)return;if(a.type==='application/pdf'){if(a.url){window.open(a.url,'_blank','noopener');return;}toast('جارٍ تجهيز الدفتر…');try{const m=await rpc('getMedia',id);download(m.name,m.type,m.data,true)}catch(e){toast(e.message)}return;}modal('<h2>'+esc(a.title||a.name)+'</h2><img data-media="'+id+'" alt="'+esc(a.title||a.name)+'"><p>'+esc(a.note||'')+'</p><button id="downloadArt">تنزيل نسخة</button>');hydrate();on('downloadArt',async()=>{let m=await rpc('getMedia',id);download(m.name,m.type,m.data,true)})}
function download(name,type,data,b64){let bytes=b64?Uint8Array.from(atob(data),c=>c.charCodeAt(0)):data;let u=URL.createObjectURL(new Blob([bytes],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}

function backup(){modal('<h2>نسختك الاحتياطية</h2><p>التصدير بيجمع بياناتك والصور والدفتر في ملف JSON خاص. الملف ممكن يكون كبير وفيه معلوماتك، احتفظي بيه في مكان آمن.</p><p class="muted">التصدير هنا من حسابك لجهازك، مش مشاركة. والاسترجاع السريع يرجع آخر تعديل صغير فقط، مش بديل للتصدير.</p><div class="actions"><button id="exportAll">تصدير كل البيانات والملفات</button><button class="line" id="exportText">تصدير البيانات فقط</button><button class="line" id="undoLast">تراجع عن آخر تعديل صغير</button></div><label>استرجاع ملف بيانات لنفس الحساب<input id="restoreFile" type="file" accept="application/json"></label><button class="line" id="restoreFileBtn">استرجاع ملفي</button><p class="muted">استرجاع «تصدير كل البيانات والملفات» بيرجع البيانات والصور والدفتر اللي اتخزنت في الملف. «تصدير البيانات فقط» بيرجع البيانات من غير الصور.</p><p id="backupStatus" class="muted"></p>');on('restoreFileBtn',async()=>{if(busy||hasQuick())return;let f=$('restoreFile').files[0];if(!f)return;try{let data=JSON.parse(await f.text());let restored=data.state||data;if(restored.version!==1||!Array.isArray(restored.items)||!Array.isArray(restored.sections)||!restored.days)throw new Error('ده مش ملف بيانات مريم.');if(!confirm('الاسترجاع هيستبدل البيانات الحالية، صدّري نسخة منها الأول. نكمل؟'))return;if(data.media){for(const [mid,mm] of Object.entries(data.media)){const bin=atob(mm.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await kv('put','media:'+mid,{name:mm.name,type:mm.type,blob:new Blob([u],{type:mm.type})})}}let rev=state.revision;restored.revision=rev;setBusy(true);state=await rpc('saveApp',rev,restored);syncLabel='محفوظ • إصدار '+state.revision;$('modal').close();render();toast('اترجعت البيانات')}catch(e){syncLabel='لم يتم الاسترجاع';toast(e.message)}finally{setBusy(false)}});on('exportText',()=>{if(hasQuick()){toast('استني حفظ العلامات قبل التصدير');return;}kv('put','lastBackup',Date.now());download('mariam-data-'+date+'.json','application/json',JSON.stringify(state,null,2))});on('exportAll',async()=>{if(busy||hasQuick()){toast('استني حفظ العلامات قبل التصدير');return;}$('exportAll').disabled=true;$('backupStatus').textContent='جارٍ جمع الملفات، سيبدأ التنزيل لما يجهز…';try{const b=await rpc('exportApp');download('mariam-full-backup-'+date+'.json','application/json',JSON.stringify(b));$('backupStatus').textContent='تم تجهيز النسخة وطلب تنزيلها. راجعي التنزيلات.'}catch(e){$('backupStatus').textContent=e.message||e}finally{$('exportAll').disabled=false}});on('undoLast',async()=>{if(busy||hasQuick())return;if(!confirm('نرجع آخر تعديل محفوظ؟ اعملي تصدير الأول لو محتاجة النسخة الحالية.'))return;try{setBusy(true);state=await rpc('restorePrevious',state.revision);syncLabel='محفوظ • إصدار '+state.revision;$('modal').close();render();toast('اترجع آخر تعديل')}catch(e){syncLabel='لم يتم التراجع';toast(e.message)}finally{setBusy(false)}})}

function hasQuick(){return quickSaving||Object.keys(quickPending).length>0;}
function quickStatus(){let pending=hasQuick();$('sync').textContent=quickFailed?'لم يتم الحفظ':pending?'جارٍ حفظ العلامات…':syncLabel;$('retryQuick').hidden=!quickFailed;$('discardQuick').hidden=!quickFailed;}
function quickToggle(kind,id){if(busy){toast('استني الحفظ الحالي يخلص');return;}let p={kind,id,date,value:kind==='plan'?!state.quran?.[id]:!day().done[id]};applyQuick(state,p);quickPending[quickKey(p)]=p;let y=window.scrollY;render();window.scrollTo(0,y);quickStatus();if(!quickSaving&&!quickFailed){clearTimeout(quickTimer);quickTimer=setTimeout(flushQuick,180);}}
async function flushQuick(){if(quickSaving||quickFailed||!Object.keys(quickPending).length)return;quickSaving=true;let batch=quickPending;quickPending={};let snapshot=JSON.parse(JSON.stringify(state));let rev=state.revision;quickStatus();try{let saved=await rpc('saveApp',rev,snapshot);state=saved;Object.values(quickPending).forEach(p=>applyQuick(state,p));syncLabel='محفوظ • إصدار '+state.revision;}catch(e){quickPending={...batch,...quickPending};quickFailed=true;toast('العلامات ظاهرة هنا لكن لم يتأكد حفظها. اختاري إعادة المحاولة أو قراءة آخر نسخة.');}finally{quickSaving=false;quickStatus();if(!quickFailed&&Object.keys(quickPending).length)flushQuick();}}
async function retryQuick(){if(quickSaving||busy)return;busy=true;try{let latest=await rpc('getApp');Object.values(quickPending).forEach(p=>applyQuick(latest,p));state=latest;quickFailed=false;render();}catch(e){toast('تعذّر الاتصال. العلامات لسه منتظرة هنا.');}finally{busy=false;quickStatus();if(!quickFailed)flushQuick();}}
async function discardQuick(){if(!confirm('نقرأ آخر نسخة محفوظة ونلغي العلامات اللي لم يتأكد حفظها في الصفحة دي؟'))return;quickPending={};quickFailed=false;await load();quickStatus();}
window.addEventListener('beforeunload',e=>{if(hasQuick()||busy){e.preventDefault();e.returnValue='';}});

$('retryQuick').onclick=retryQuick;$('discardQuick').onclick=discardQuick;$('refresh').onclick=load;load();


/* backup reminder: shown when no export in 3 days; this is a manual save, nothing is uploaded automatically */
(async()=>{try{const t=await kv('get','lastBackup');const old=!t||Date.now()-t>3*864e5;if(old){const b=document.createElement('div');b.id='bk';b.style.cssText='background:#f6e2bf;border-bottom:2px solid #b96a43;padding:8px 24px;font-size:14px;color:#840514;text-align:center';b.innerHTML='بياناتك على جوالك بس. احفظي نسخة احتياطية (مساحتي ← نسختك الاحتياطية) وخزنيها في Files أو iCloud.';document.querySelector('header').after(b)}if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
/* ---- stage 1 additions: daily priority/thanks, links, books & quotes (all local) ---- */
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function dailyExtras(){const d=day();return '<div class="card"><h3>أهم حاجة النهارده</h3><input id="dpriority" maxlength="160" placeholder="أهم حاجة أحب أنجزها" value="'+esc(d.priority||'')+'"><label>الحمد والشكر<input id="dthanks" maxlength="200" placeholder="حاجة أنا ممتنة لها" value="'+esc(d.thanks||'')+'"></label><div class="actions"><button id="saveDaily" data-write>حفظ</button></div></div>'}
function booksDlg(id){const bs=state.books||[];if(id==='new'){return bookEdit()}
 const b=bs.find(x=>x.id===id);if(b)return bookView(b);
 modal('<h2>كتبي واقتباساتي</h2>'+(bs.length?bs.map(x=>'<div class="task"><span class="grow"><strong>'+esc(x.title)+'</strong><small style="display:block">'+esc(x.author||'')+' • '+((x.quotes||[]).length)+' اقتباس</small></span><button class="soft" data-bk-open="'+x.id+'">فتح</button></div>').join(''):'<p class="muted">لسه مفيش كتب. أضيفي أول كتاب وسجلي اقتباساتك.</p>')+'<div class="actions"><button id="bkNew">＋ كتاب</button></div>');
 $('bkNew').onclick=()=>bookEdit();document.querySelectorAll('[data-bk-open]').forEach(b=>b.onclick=()=>bookView(b.dataset.bkOpen))}
function bookEdit(){modal('<h2>كتاب جديد</h2><label>اسم الكتاب<input id="bkTitle" maxlength="120"></label><label>الكاتب<input id="bkAuthor" maxlength="100"></label><div class="actions"><button id="bkSave">حفظ</button></div>');
 $('bkSave').onclick=async()=>{const t=$('bkTitle').value.trim();if(!t){toast('اكتبي اسم الكتاب');return}const a=$('bkAuthor').value.trim();const nid=newId('bk');if(await save(s=>{(s.books=s.books||[]).push({id:nid,title:t,author:a,quotes:[]})})){$('modal').close();bookView(nid)}}}
function bookView(idOrObj){const b=typeof idOrObj==='string'?(state.books||[]).find(x=>x.id===idOrObj):idOrObj;if(!b)return;
 modal('<h2>'+esc(b.title)+'</h2><small>'+esc(b.author||'')+'</small>'+((b.quotes||[]).length?b.quotes.map((q,i)=>'<div class="card" style="margin:12px 0;padding:16px"><p style="margin:0">'+esc(q.text)+'</p>'+(q.page?'<small>صفحة '+esc(q.page)+'</small>':'')+(q.note?'<small style="display:block">ملاحظتي: '+esc(q.note)+'</small>':'')+'<div class="actions"><button class="soft" data-q-img="'+i+'">صورة</button><button class="line" data-q-del="'+i+'">إزالة</button></div></div>').join(''):'<p class="muted">مفيش اقتباسات لسه.</p>')+'<label>اقتباس جديد<textarea id="qText" maxlength="600"></textarea></label><div class="fieldgrid"><label>الصفحة<input id="qPage" maxlength="10"></label><label>ملاحظتي<input id="qNote" maxlength="200"></label></div><div class="actions"><button id="qAdd">＋ أضيف الاقتباس</button><button class="line" id="bkBack">كتبي</button><button class="line danger" id="bkDel">إزالة الكتاب</button></div>');
 $('qAdd').onclick=async()=>{const t=$('qText').value.trim();if(!t){toast('اكتبي الاقتباس');return}if(await save(s=>{s.books.find(x=>x.id===b.id).quotes.push({text:t,page:$('qPage').value.trim(),note:$('qNote').value.trim()})})){$('modal').close();bookView(b.id)}};
 $('bkBack').onclick=()=>{$('modal').close();booksDlg()};
 $('bkDel').onclick=async()=>{if(!confirm('نشيل الكتاب واقتباساته؟'))return;if(await save(s=>{s.books=s.books.filter(x=>x.id!==b.id)})){$('modal').close();booksDlg()}};
 document.querySelectorAll('[data-q-del]').forEach(x=>x.onclick=async()=>{if(!confirm('نشيل الاقتباس؟'))return;if(await save(s=>{s.books.find(y=>y.id===b.id).quotes.splice(+x.dataset.qDel,1)})){$('modal').close();bookView(b.id)}});
 document.querySelectorAll('[data-q-img]').forEach(x=>x.onclick=()=>quoteImage(b,b.quotes[+x.dataset.qImg]))}
function wrapLines(ctx,text,maxW){const words=text.split(/\s+/),lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
function quoteImage(b,q){const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.direction='rtl';x.textAlign='center';
 x.fillStyle='#840514';x.fillRect(0,0,W,H);x.strokeStyle='#c9902c';x.lineWidth=10;x.strokeRect(36,36,W-72,H-72);x.strokeStyle='#14213d';x.lineWidth=6;x.strokeRect(58,58,W-116,H-116);x.fillStyle='#f7ecd8';x.fillRect(86,86,W-172,H-172);
 let size=56,lines;const F=s=>s+'px Tahoma,Arial,sans-serif';while(true){x.font=F(size);lines=wrapLines(x,q.text,W-300);if(lines.length*size*1.7<H-560||size<30)break;size-=3}
 x.fillStyle='#1d1620';const th=lines.length*size*1.7;let y=(H-th)/2+size*0.4;lines.forEach(l=>{x.fillText(l,W/2,y);y+=size*1.7});
 x.fillStyle='#c9902c';x.font=F(40);x.fillText('❖',W/2,190);
 x.fillStyle='#840514';x.font=F(36);x.fillText('— '+b.title+(b.author?' • '+b.author:''),W/2,H-210);
 x.fillStyle='#6b5a52';x.font='28px Arial,sans-serif';x.direction='ltr';x.fillText('Mariam studio',W/2,H-140);
 const url=c.toDataURL('image/png');modal('<h2>صورة الاقتباس</h2><img src="'+url+'" alt="صورة الاقتباس" style="width:100%"><p class="muted">اضغطي مطولًا على الصورة واختاري «حفظ في الصور».</p>')}
function linksDlg(){const ls=state.links||[];modal('<h2>روابطي</h2>'+(ls.length?ls.map((l,i)=>'<div class="task"><span class="grow"><strong>'+esc(l.name)+'</strong></span><a href="'+esc(l.url)+'" target="_blank" rel="noopener"><button class="soft">فتح</button></a><button class="line" data-l-del="'+i+'">إزالة</button></div>').join(''):'<p class="muted">اجمعي هنا روابط يوتيوب أو درايف اللي بترجعي لها.</p>')+'<label>الاسم<input id="lName" maxlength="80"></label><label>الرابط<input id="lUrl" inputmode="url" dir="ltr" placeholder="https://"></label><div class="actions"><button id="lAdd">＋ أضيف الرابط</button></div>');
 $('lAdd').onclick=async()=>{const n=$('lName').value.trim();let u=$('lUrl').value.trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;let ok=false;try{ok=/^https?:$/.test(new URL(u).protocol)}catch(e){}if(!n||!ok){toast('اكتبي اسم ورابط صحيح');return}if(await save(s=>{(s.links=s.links||[]).push({id:newId('l'),name:n,url:u})})){$('modal').close();linksDlg()}};
 document.querySelectorAll('[data-l-del]').forEach(b=>b.onclick=async()=>{if(!confirm('نشيل الرابط؟'))return;if(await save(s=>{s.links.splice(+b.dataset.lDel,1)})){$('modal').close();linksDlg()}})}
const _bind1=bind;bind=function(){_bind1();on('saveDaily',()=>save(s=>{const d=day(s);d.priority=$('dpriority').value.trim();d.thanks=$('dthanks').value.trim()}));on('bookTile',()=>booksDlg());on('linkTile',()=>linksDlg())};
/* ---- in-app notebook reader: pages are images stored privately on this device ---- */
function nbPages(){return state.assets?.notebook?.pages||null}
function notebookCard(){const n=state.assets.notebook;if(nbPages())return '<button id="nbRead">قراءة الدفتر داخل التطبيق</button><p class="muted" style="margin-top:10px">'+nbPages().length+' صفحة محفوظة على جوالك.</p><button class="line" data-nb-import="1">استبدال صفحات الدفتر</button>';
 return (n?'<p class="muted">ملف الدفتر القديم مش بيتقرا جوه التطبيق. استوردي ملف صفحات الدفتر.</p>':'<p class="muted">الدفتر لسه مش موجود في التطبيق ده.</p>')+'<button id="nbImportBtn" data-nb-import="1">استيراد صفحات الدفتر</button>'+(n&&n.url?'<p style="margin-top:10px"><small class="muted">رابط قديم محفوظ</small></p>':'')}
function nbImport(){modal('<h2>استيراد صفحات الدفتر</h2><p class="muted">اختاري ملف «mariam-notebook-pages.json» اللي حفظتيه في Files. الصفحات بتتخزن على جوالك بس.</p><input id="nbFile" type="file" accept="application/json,.json"><div class="actions"><button id="nbGo">استيراد</button></div><p id="nbStatus" class="muted"></p>');
 $('nbGo').onclick=async()=>{const f=$('nbFile').files[0];if(!f){toast('اختاري الملف');return}if(busy||hasQuick()){toast('استني الحفظ يخلص');return}setBusy(true);const st=$('nbStatus');try{st.textContent='جارٍ القراءة…';const d=JSON.parse(await f.text());if(d.kind!=='mariam-notebook-pages'||!Array.isArray(d.pages)||!d.pages.length)throw new Error('ده مش ملف صفحات الدفتر.');const ids=[];for(let i=0;i<d.pages.length;i++){st.textContent='جارٍ الحفظ '+(i+1)+' / '+d.pages.length;const bin=atob(d.pages[i]),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);const id='nbp'+String(i+1).padStart(3,'0');await kv('put','media:'+id,{name:'page-'+(i+1)+'.jpg',type:'image/jpeg',blob:new Blob([u],{type:'image/jpeg'})});ids.push(id)}
 const cur=await LS.getApp();const next=JSON.parse(JSON.stringify(cur));const old=next.assets.notebook;if(old)next.trash.push({kind:'asset',value:{...old}});next.assets.notebook={id:'nbpages',type:'pages',name:d.name||'الدفتر',size:0,created:new Date().toISOString(),pages:ids};state=await LS.saveApp(cur.revision,next);setBusy(false);$('modal').close();render();toast('الدفتر جاهز للقراءة')}catch(e){st.textContent=e.message||String(e)}finally{busy&&setBusy(false)}}}
async function nbReader(start=1){const ids=nbPages();if(!ids)return;const ov=document.createElement('div');ov.id='nbov';ov.style.cssText='position:fixed;inset:0;z-index:50;background:#100e16;overflow:auto;-webkit-overflow-scrolling:touch';
 ov.innerHTML='<div style="position:sticky;top:0;z-index:2;background:#100e16;color:#f7ecd8;display:flex;gap:8px;align-items:center;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))"><button id="nbClose" class="line">إغلاق</button><span class="grow" id="nbPos" style="text-align:center"></span><input id="nbGoto" type="number" min="1" max="'+ids.length+'" placeholder="صفحة" style="width:80px"><button id="nbJump" class="soft">اذهبي</button></div><div id="nbList" style="max-width:900px;margin:auto;padding:8px 8px 60px"></div>';
 document.body.appendChild(ov);const list=ov.querySelector('#nbList');const urls={};
 ids.forEach((id,i)=>{const d=document.createElement('div');d.dataset.i=i;d.style.cssText='background:#f7ecd8;margin:0 0 10px;aspect-ratio:419.5/595.3;width:100%;display:grid;place-items:center;color:#6b5a52';d.textContent=(i+1);list.appendChild(d)});
 const load=async d=>{const i=+d.dataset.i;if(d.dataset.l)return;d.dataset.l=1;try{const m=await kv('get','media:'+ids[i]);if(!m)throw 0;const u=urls[i]=URL.createObjectURL(m.blob);d.style.aspectRatio='';d.innerHTML='';const im=new Image();im.src=u;im.alt='صفحة '+(i+1);im.style.cssText='display:block;width:100%;height:auto';d.appendChild(im)}catch(e){d.textContent='الصفحة '+(i+1)+' مش موجودة'}};
 const unload=d=>{const i=+d.dataset.i;if(!d.dataset.l)return;const h=d.getBoundingClientRect().height;d.dataset.l='';d.innerHTML=(i+1);d.style.height=h+'px';if(urls[i]){URL.revokeObjectURL(urls[i]);delete urls[i]}};
 const pos=ov.querySelector('#nbPos');let cur=1;const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){load(e.target);}else if(Math.abs(+e.target.dataset.i+1-cur)>6)unload(e.target)})},{root:ov,rootMargin:'1200px 0px'});
 list.querySelectorAll('[data-i]').forEach(d=>io.observe(d));const upd=()=>{const y=ov.scrollTop+140;let n=1;for(const c of list.children){if(c.offsetTop<=y)n=+c.dataset.i+1;else break}cur=n;pos.textContent='صفحة '+n+' / '+ids.length};let tk=0;ov.addEventListener('scroll',()=>{if(tk)return;tk=setTimeout(()=>{tk=0;upd()},120)});setTimeout(upd,200);
 const jump=n=>{n=Math.max(1,Math.min(ids.length,n|0));const t=list.children[n-1];load(t);ov.scrollTop=t.offsetTop-50};
 ov.querySelector('#nbJump').onclick=()=>jump(+ov.querySelector('#nbGoto').value);ov.querySelector('#nbClose').onclick=()=>{io.disconnect();Object.values(urls).forEach(URL.revokeObjectURL);try{localStorage.setItem('nbLast',cur)}catch(e){}ov.remove()};
 const last=+(localStorage.getItem('nbLast')||start);if(last>1)setTimeout(()=>jump(last),100);}
const _bind2=bind;bind=function(){_bind2();on('nbRead',()=>nbReader());document.querySelectorAll('[data-nb-import]').forEach(b=>b.onclick=nbImport)};
</script><script src="extra.js"></script></body></html>
