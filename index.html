@keyframes arrive{from{opacity:.35;transform:translateY(9px)}to{opacity:1;transform:none}}.shell{animation:arrive .28s ease both}@media(prefers-reduced-motion:reduce){.shell{animation:none}*{scroll-behavior:auto!important}}</style></head><body><header><div class="bar"><span class="brand">مريم <span style="font-size:16px">❀</span></span><small id="sync"></small><button class="soft" id="retryQuick" hidden="">إعادة المحاولة</button><button class="soft" id="discardQuick" hidden="">قراءة آخر نسخة</button><button class="soft" id="refresh">↻ تحديث</button></div></header><main class="shell" id="app"></main><nav class="bottom" id="nav"><button data-go="home" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8M5 10v11h5v-7h4v7h5V10"></path></svg>الرئيسية</button><button data-go="today" class=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0"></path></svg>يومي</button><button data-go="worship" class=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"></path></svg>علاقتي بربنا</button><button data-go="works" class=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 0-4h-1a2 2 0 0 1 0-4h4a5 5 0 0 0 0-10ZM7 8h.1M7 13h.1M12 7h.1M17 7h.1"></path></svg>أعمالي</button><button data-go="more" class=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.1M12 12h.1M19 12h.1"></path></svg>مساحتي</button></nav><div id="toast" role="status"></div><dialog id="modal"></dialog><script>
/* ---- local-first storage adapter (replaces google.script.run). Data stays on this device. ---- */
const INIT={"version": 1, "revision": 0, "sections": [{"id": "worship", "name": "علاقتي بربنا", "icon": "moon"}, {"id": "learn", "name": "تعلمي وقراءتي", "icon": "book"}, {"id": "home", "icon": "home", "name": "بيتي"}, {"icon": "flower", "id": "self", "name": "صحتي وعنايتي"}, {"id": "family", "name": "أهلي ووقتي", "icon": "heart"}], "courses": {}, "seeded": false, "days": {}, "shopping": [], "meals": [], "works": [], "reading": {"book": "", "today": "", "page": ""}, "assets": {}, "trash": []};
const DB='mariam-local',idb=()=>new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kv=async(m,k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv');const q=m==='get'?t.get(k):m==='del'?t.delete(k):t.put(v,k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
const b64=blob=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.readAsDataURL(blob)});
const rid=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const LS={
 async getApp(){let s=await kv('get','state');if(!s){s=JSON.parse(JSON.stringify(INIT));s.created=new Date().toISOString();await kv('put','state',s)}return s},
 async saveApp(rev,next){const cur=await LS.getApp();if(cur.revision!==rev)throw new Error('النسخة اتغيرت، اضغطي تحديث');await kv('put','prev',cur);next.revision=rev+1;next.updated=new Date().toISOString();await kv('put','state',next);return next},
 async restorePrevious(rev){const cur=await LS.getApp(),p=await kv('get','prev');if(!p)throw new Error('مفيش نسخة سابقة');p.revision=cur.revision+1;await kv('put','state',p);return p},
 async getMedia(id){const m=await kv('get','media:'+id);if(!m)throw new Error('الملف مش موجود على الجهاز');return {name:m.name,type:m.type,data:await b64(m.blob)}},
 async uploadAsset(form){const f=new FormData(form),file=f.get('file'),kind=f.get('kind');const cur=await LS.getApp();const id=rid();await kv('put','media:'+id,{name:file.name,type:file.type,blob:file});const next=JSON.parse(JSON.stringify(cur));const rec={id,type:file.type,name:file.name,size:file.size,created:new Date().toISOString()};if(kind==='work')next.works.push({...rec,category:f.get('category'),title:f.get('title'),note:f.get('note')||''});else next.assets[kind]=rec;return LS.saveApp(cur.revision,next)},
 async exportApp(){const st=await LS.getApp(),media={};const ids=[...Object.values(st.assets||{}),...(st.works||[])].map(x=>x.id);for(const id of ids){try{media[id]=await LS.getMedia(id)}catch(e){}}await kv('put','lastBackup',Date.now());return {state:st,media}}
};
function rpc(name,...args){return LS[name](...args)}

const paths={home:'M3 11 12 3l9 8M5 10v11h5v-7h4v7h5V10',sun:'M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',moon:'M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z',book:'M12 5C8 2 3 4 3 4v16s5-2 9 1c4-3 9-1 9-1V4s-5-2-9 1Zm0 0v16',flower:'M12 9c-7-12-13 2-3 3-12 7 2 13 3 3 7 12 13-2 3-3 12-7-2-13-3-3Zm2 3a2 2 0 1 1-4 0 2 2 0 0 1 4 0',heart:'M20 5c-4-4-8 1-8 1s-4-5-8-1c-5 5 8 15 8 15S25 10 20 5Z',art:'M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 0-4h-1a2 2 0 0 1 0-4h4a5 5 0 0 0 0-10ZM7 8h.1M7 13h.1M12 7h.1M17 7h.1',more:'M5 12h.1M12 12h.1M19 12h.1',check:'m5 12 4 4L19 6',edit:'m4 17 1 4 4-1L20 9l-5-5Zm9-11 5 5',calendar:'M5 5h14v16H5Zm3-3v6m8-6v6M5 10h14'};
const icon=(n)=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+(paths[n]||paths.flower)+'"/></svg>';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null,route='home',sub='',busy=false,date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),mediaCache={},pendingUploads=0,syncLabel='';
const cats=['تصميماتي','رسوماتي','الخط الحر','الخط الديواني'];
const defaults=[];
function seed(){if(state.seeded)return;state.items=defaults.map((x,i)=>({id:'base'+i,section:x[0],name:x[1],part:x[2],cadence:x[3]||'يومي',hideFriday:x[0]==='home'}));state.seeded=true;}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',4500)}
function setBusy(v){busy=v;document.querySelectorAll('button[data-write]').forEach(b=>b.disabled=v);$('sync').textContent=v?'جارٍ الحفظ…':syncLabel;}
async function load(){if(busy)return;if(hasQuick()){toast('في علامات لم يتأكد حفظها. استني الحفظ أو استخدمي خيارات إعادة المحاولة.');return;}setBusy(true);try{state=await rpc('getApp');seed();render();syncLabel='آخر قراءة '+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});}catch(e){syncLabel='تعذّرت القراءة';toast(e.message||e);$('app').innerHTML='<div class="card">تعذّر فتح البيانات. اضغطي تحديث. ما اتغيرش أي شيء.</div>';}finally{setBusy(false)}}
async function save(mut){if(busy)return;if(hasQuick()){toast('العلامات بتتحفظ، استني رسالة محفوظ قبل تعديل التفاصيل');return false;}let next=JSON.parse(JSON.stringify(state));mut(next);setBusy(true);try{state=await rpc('saveApp',state.revision,next);syncLabel='محفوظ • إصدار '+state.revision;render();return true;}catch(e){syncLabel='لم يتم الحفظ، اضغطي تحديث';toast(e.message||e);return false;}finally{setBusy(false)}}
function day(s=state){return s.days[date]||(s.days[date]={done:{},note:'',friday:{},pages:''});}function done(id){return !!day().done[id]}function friday(){return new Date(date+'T12:00:00+03:00').getDay()===5}function go(r,s=''){if(busy){toast('استني الحفظ يخلص الأول');return;}route=r;sub=s;render();window.scrollTo(0,0)}
function row(it){const v=done(it.id);return '<div class="task '+(v?'done':'')+'"><button class="tick '+(v?'done':'')+'" data-write aria-label="'+esc(it.name)+'" data-toggle="'+it.id+'">'+(v?icon('check'):'')+'</button><div class="grow"><div class="taskname">'+esc(it.name)+'</div>'+(it.cadence!=='يومي'?'<small>'+esc(it.cadence)+(it.cadence==='يوم ويوم'?'، اختاري أيامك بنفسك':'')+'</small>':'')+'</div><button class="edit" data-edit="'+it.id+'" aria-label="تعديل">'+icon('edit')+'</button></div>'}
function datebar(){return '<div class="row between" style="margin-bottom:18px"><div><h1>'+({home:'مساحتك يا مريم',today:'يومي',worship:'علاقتي بربنا',works:'أعمالي',more:'على مهلك',section:state.sections.find(x=>x.id===sub)?.name||'قسمي'}[route]||'مريم')+'</h1><small>'+new Date(date+'T12:00:00+03:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</small></div>'+(['today','worship','section'].includes(route)?'<input style="width:150px" id="date" type="date" value="'+date+'">':'')+'</div>'}
function render(){if(!state)return;day();$('app').style.animation='none';$('app').innerHTML=datebar()+view();void $('app').offsetWidth;$('app').style.animation='';$('nav').innerHTML=[['home','home','الرئيسية'],['today','sun','يومي'],['worship','moon','علاقتي بربنا'],['works','art','أعمالي'],['more','more','مساحتي']].map(([r,i,n])=>'<button data-go="'+r+'" class="'+(route===r?'active':'')+'">'+icon(i)+n+'</button>').join('');bind();hydrate();quickStatus();}
function view(){if(route==='home')return home();if(route==='today')return today();if(route==='worship')return worship();if(route==='works')return works();if(route==='section')return section();return more();}
function home(){return '<div class="card hero"><div>'+(state.assets.cover?'<img data-media="'+state.assets.cover.id+'" alt="غلاف مريم المعتمد">':'<div class="cover-empty">مريم</div>')+'</div><div><span class="pill">مساحة خاصة بيكي</span><h1 style="margin-top:14px">وَقُلْ رَبِّ زِدْنِي عِلْمًا</h1><small>سورة طه • ١١٤</small><p>عبادتك وتعلّمك وبيتك وأعمالك، في مكان واحد. من غير ضغط ولا تكديس للي فات.</p><div class="actions"><button data-go="today">ابدئي يومك</button><button class="soft" data-go="works">معرض أعمالي</button></div></div></div>'+(friday()?'<div class="notice">النهارده الجمعة، راحة من الطبخ والتنظيف. وقفتك الأسبوعية اختيارية في مساحتي.</div>':'')+'<div class="grid">'+state.sections.map(s=>'<button class="tile" data-section="'+s.id+'"><span class="ico">'+icon(s.icon)+'</span><span><strong>'+esc(s.name)+'</strong><small>'+({worship:'صلاتي، قرآني وأذكاري',learn:'دروسي، مهاراتي وكتبي',home:'أفكار الغدا وقائمة المشتريات',self:'حركة بسيطة وعناية بنفسي',family:'أهلي ووقت للونس'}[s.id]||'مساحتك القابلة للتعديل')+'</small></span></button>').join('')+'</div><div class="card" style="margin-top:18px"><h3>إيه اللي فرّحك أو أنجزتيه النهارده؟</h3><p class="muted">سطر واحد كفاية، وممكن تسيبيه فاضي.</p><textarea id="reflection" placeholder="اكتبي لحظة حلوة…">'+esc(day().note)+'</textarea><div class="actions"><button data-write id="saveReflection">حفظ السطر</button></div></div>';}
function today(){let items=state.items.filter(x=>!x.archived&&x.section!=='worship'&&!(friday()&&x.hideFriday));return '<div class="notice">العبادات في «علاقتي بربنا» بعلامات مستقلة، من غير درجات. مفيش نقل تلقائي للمتأخر.</div>'+(['صبح','بعد الظهر','بليل','مرن'].map(p=>{let a=items.filter(x=>x.part===p);return a.length?'<div class="card"><div class="section-title">'+icon(p==='بليل'?'moon':'sun')+'<h3>'+p+'</h3></div>'+a.map(row).join('')+'</div>':''}).join(''))+'<button class="line" id="addTask">＋ أضيف مهمة</button><div class="card" style="margin-top:18px"><h3>قراءة النهارده</h3><p>هدفك ٢٠ صفحة، واللي قريتيه تسجليه من غير ضغط.</p><input id="pages" type="number" min="0" value="'+esc(day().pages||'')+'" placeholder="عدد الصفحات"><div class="actions"><button id="savePages" data-write>حفظ القراءة</button></div></div>';}
const qa=['١–٥','٦–١٠','١١–١٥','١٦–٢٠','٢١–٢٥','٢٦–٣٠','٣١–٣٥','٣٦–٤٠','٤١–٤٥'],na=['٧٥–٧٩','٨٠–٨٦','٨٧–٩١','٩٢–٩٤','٩٥–١٠١','١٠٢–١٠٥','١٠٦–١١٣','١١٤–١٢١','١٢٢–١٢٧'];
function worship(){return '<div class="subnav"><button data-wtab="daily" class="'+(sub!=='quran'?'active':'')+'">صلاتي وأذكاري</button><button data-wtab="quran" class="'+(sub==='quran'?'active':'')+'">الحفظ والمراجعة</button></div>'+(sub==='quran'?'<div class="card"><h3>خطتك، جزء وراء جزء</h3><p class="muted">٩ أجزاء بالآيات، مش مرتبطة بتاريخ. ابدئي من مكانك الحقيقي، وكرري الجزء للتثبيت لو حبيتي. الحفظ والمراجعة منفصلين، والعلامة دي تقدم الخطة مش علامة يومية.</p><div class="quran-row"><span></span><strong>حفظ سورة ق</strong><strong>مراجعة النساء</strong></div>'+qa.map((q,i)=>'<div class="quran-row"><strong>'+(i+1)+'</strong>'+['q','n'].map(k=>'<button data-plan="'+k+i+'" class="'+(state.quran?.[k+i]?'done':'')+'">'+(state.quran?.[k+i]?'✓':'○')+' الآيات '+(k==='q'?q:na[i])+'</button>').join('')+'</div>').join('')+'</div><div class="card"><h3>دفتر الحفظ والتثبيت</h3><p>نسختك الفارسية الأصلية، ٧٩ صفحة، من غير تغيير.</p>'+(state.assets.notebook?'<button data-open="'+state.assets.notebook.id+'">فتح الدفتر PDF</button>':'<p class="muted">جارٍ تجهيز ملف الدفتر الأصلي.</p>')+'</div>':'<div class="card"><p class="muted">كل علامة لوحدها، الصلاة لا تعلّم آية الكرسي تلقائيًا، ومفيش درجات أو مقارنة.</p>'+state.items.filter(x=>x.section==='worship'&&!x.archived).map(row).join('')+'</div><button class="line" id="addWorship">＋ إضافة متابعة</button>');}
function section(){let sec=state.sections.find(s=>s.id===sub);if(!sec)return '';let html='<div class="card">'+state.items.filter(x=>x.section===sub&&!x.archived&&!(friday()&&x.hideFriday)).map(row).join('')+(sub==='home'&&friday()?'<div class="notice">الجمعة راحة، مهام الطبخ والتنظيف مخفية النهارده.</div>':'')+'<button class="soft" id="addTask">＋ إضافة</button></div>';if(sub==='learn')html+=learning();if(sub==='home')html+=house();if(sub==='self')html+='<div class="card"><h3>عناية أسبوعية على مزاجك</h3><p>فكرة حمام مغربي مرة في الأسبوع، اختاري يومك من غير ميعاد مفروض.</p><textarea id="care" placeholder="خطوة العناية اللي تناسبك">'+esc(state.care||'')+'</textarea><div class="actions"><button id="saveCare" data-write>حفظ</button></div></div>';return html;}
function weekStart(){let d=new Date(date+'T12:00:00+03:00');let n=d.getDay();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'})}function weekDates(){let d=new Date(weekStart()+'T12:00:00+03:00');return Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(x.getDate()+i);return x.toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'})})}
function learning(){return '<div class="card"><h3>خطوتك الأسبوعية</h3><small>الأسبوع من الأحد للسبت. اختاري أيامك بنفسك.</small>'+[['تجويد',3],['تفسير',3],['فقه حنفي',2]].map(([n,target])=>{let key='study:'+n,count=weekDates().filter(d=>state.days[d]?.done?.[key]).length;return '<div class="task"><button class="tick '+(done(key)?'done':'')+'" data-toggle="'+key+'" data-write>'+(done(key)?'✓':'')+'</button><div class="grow">'+n+'<small style="float:left">'+count+' / '+target+' مرات</small><div class="progress"><i style="width:'+Math.min(100,count/target*100)+'%"></i></div></div></div>'}).join('')+'</div><div class="card"><h3>رفّ القراءة</h3><label>اسم الكتاب<input id="book" value="'+esc(state.reading.book)+'"></label><label>آخر صفحة وصلتي لها<input type="number" min="0" id="lastpage" value="'+esc(state.reading.page)+'"></label><button id="saveReading" data-write>حفظ مكان القراءة</button><p class="muted" style="margin-top:12px">تسجيل عدد صفحات اليوم موجود في «يومي»، جنب هدف ٢٠ صفحة.</p></div><div class="card"><div class="row between"><h3>آخر درس والخطوة الجاية</h3><button class="soft" id="addCourse">＋ كورس</button></div>'+[...Object.keys(state.courses)].map(n=>'<div class="task"><div class="grow"><strong>'+esc(n)+'</strong><small style="display:block">'+esc(state.courses[n]?.last||'لسه ما سجلتيش آخر درس')+'</small><small>الجاية: '+esc(state.courses[n]?.next||'اختاري خطوة صغيرة')+'</small></div><button class="soft" data-course="'+esc(n)+'">تعديل</button></div>').join('')+'</div>';}
function house(){return '<div class="card"><h3>أفكار الغدا</h3><p class="muted">الأفكار هنا اختيارية، مش مهام للجمعة.</p>'+state.meals.map((x,i)=>'<div class="task"><span class="grow">'+esc(x)+'</span><button class="soft" data-meal-del="'+i+'">إزالة</button></div>').join('')+'<div class="row"><input class="grow" id="meal" placeholder="فكرة أكلة"><button id="addMeal">＋</button></div></div><div class="card"><h3>قائمة مشتريات واحدة</h3>'+state.shopping.map((x,i)=>'<div class="task"><button class="tick '+(x.done?'done':'')+'" data-shop="'+i+'">'+(x.done?'✓':'')+'</button><span class="grow">'+esc(x.name)+'</span><button class="soft" data-shop-del="'+i+'">إزالة</button></div>').join('')+'<div class="row"><input class="grow" id="shop" placeholder="أضيف حاجة"><button id="addShop">＋</button></div></div>';}
function works(){let cat=sub||cats[0],a=state.works.filter(x=>x.category===cat);return '<div class="subnav">'+cats.map(c=>'<button data-cat="'+c+'" class="'+(cat===c?'active':'')+'">'+c+'</button>').join('')+'</div><div class="row between" style="margin-bottom:18px"><p class="muted">معرض خاص بيكي، الصور محفوظة في حسابك.</p><button id="addWork">＋ أضيف عمل</button></div>'+(a.length?'<div class="gallery">'+a.map(x=>'<article class="art"><img data-media="'+x.id+'" data-open="'+x.id+'" alt="'+esc(x.title)+'"><div class="pad"><strong>'+esc(x.title)+'</strong><small style="display:block">'+esc(x.note)+'</small><div class="actions"><button class="soft" data-work-edit="'+x.id+'">تعديل</button><button class="line" data-work-del="'+x.id+'">إزالة</button></div></div></article>').join('')+'</div>':'<div class="card empty">'+icon('art')+'<h3>مكان لأعمالك الجميلة</h3><p>أول ما تضيفي عمل هيظهر هنا، وكل نوع في مجموعته.</p><button class="soft" id="addWorkEmpty">أضيف أول عمل</button></div>');}
function more(){return '<div class="grid"><button class="tile" id="friday"><span class="ico">'+icon('flower')+'</span><strong>روتين الجمعة</strong><small>راحة ووقفة خفيفة لو حبيتي</small></button><button class="tile" id="journal"><span class="ico">'+icon('book')+'</span><strong>يومياتي وإنجازاتي</strong><small>لحظاتك المحفوظة بالأيام</small></button><button class="tile" id="manage"><span class="ico">'+icon('edit')+'</span><strong>أعدّل مساحتي</strong><small>الأقسام والمهام والتقسيم</small></button><button class="tile" id="backup"><span class="ico">'+icon('calendar')+'</span><strong>نسخة احتياطية</strong><small>بياناتك وأعمالك على جوالك بس</small></button></div><div class="card" style="margin-top:20px"><h3>إيقاع يومك، مش جدول إجباري</h3><p class="muted">اكتبي هنا إيقاع يومك بالشكل اللي يريحك. الأيام مرنة وانتي اللي تختاري.</p><textarea id="rhythm">'+esc(state.rhythm||'')+'</textarea><div class="actions"><button id="saveRhythm" data-write>أحفظ ملاحظتي</button></div></div><div class="card"><h3>الحفظ والخصوصية</h3><p class="muted">بياناتك محفوظة على الجوال ده بس، ومفيش مزامنة ولا نسخة تلقائية خارج الجوال. لو التطبيق اتمسح أو الجوال اتغيّر أو iOS مسح البيانات، ممكن تضيع. اعملي نسخة احتياطية من «نسختك الاحتياطية» بانتظام وخزنيها في Files أو iCloud.</p><p class="muted">الصور لحد ٨ ميجابايت. الإزالة داخل التطبيق بتنقل لسلة الاسترجاع.</p><button class="line" id="trash">سلة الاسترجاع ('+state.trash.length+')</button></div>';}
async function hydrate(){for(const img of document.querySelectorAll('img[data-media]')){const id=img.dataset.media;try{if(!mediaCache[id]){img.style.opacity='.35';const m=await rpc('getMedia',id);mediaCache[id]='data:'+m.type+';base64,'+m.data;}img.src=mediaCache[id];img.style.opacity='1';}catch(e){img.alt='تعذّر تحميل الصورة، جرّبي تحديث';}}}
function modal(html){$('modal').innerHTML='<button class="close" aria-label="إغلاق" onclick="document.getElementById(\'modal\').close()">×</button>'+html;$('modal').showModal();}
function on(id,fn){if($(id))$(id).onclick=fn}function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>b.dataset.section==='worship'?go('worship'):go('section',b.dataset.section));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>quickToggle('day',b.dataset.toggle));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTask(b.dataset.edit));document.querySelectorAll('[data-wtab]').forEach(b=>b.onclick=()=>go('worship',b.dataset.wtab));document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>quickToggle('plan',b.dataset.plan));document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>go('works',b.dataset.cat));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMedia(b.dataset.open));document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>course(b.dataset.course));document.querySelectorAll('[data-work-edit]').forEach(b=>b.onclick=()=>editWork(b.dataset.workEdit));document.querySelectorAll('[data-work-del]').forEach(b=>b.onclick=()=>{if(confirm('ننقل العمل لسلة الاسترجاع؟'))save(s=>{let i=s.works.findIndex(x=>x.id===b.dataset.workDel);s.trash.push({kind:'work',value:s.works.splice(i,1)[0],at:new Date().toISOString()})})});if($('date'))$('date').onchange=e=>{date=e.target.value;render()};on('saveReflection',()=>{let v=$('reflection').value;save(s=>day(s).note=v)});on('savePages',()=>{let v=$('pages').value;save(s=>day(s).pages=v)});on('saveCare',()=>{let v=$('care').value;save(s=>s.care=v)});on('saveRhythm',()=>{let v=$('rhythm').value;save(s=>s.rhythm=v)});on('addTask',()=>editTask());on('addWorship',()=>editTask(null,'worship'));on('saveReading',()=>{let b=$('book').value,p=$('lastpage').value;save(s=>{s.reading.book=b;s.reading.page=p})});on('addCourse',()=>{let n=prompt('اسم الكورس أو المهارة');if(n?.trim())course(n.trim())});on('addMeal',()=>{let v=$('meal').value.trim();if(v)save(s=>s.meals.push(v))});on('addShop',()=>{let v=$('shop').value.trim();if(v)save(s=>s.shopping.push({name:v,done:false}))});document.querySelectorAll('[data-meal-del]').forEach(b=>b.onclick=()=>save(s=>s.meals.splice(+b.dataset.mealDel,1)));document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>save(s=>s.shopping[+b.dataset.shop].done=!s.shopping[+b.dataset.shop].done));document.querySelectorAll('[data-shop-del]').forEach(b=>b.onclick=()=>save(s=>s.shopping.splice(+b.dataset.shopDel,1)));on('addWork',()=>uploadDialog('work'));on('addWorkEmpty',()=>uploadDialog('work'));on('friday',fridayDialog);on('journal',journal);on('manage',manage);on('backup',backup);on('trash',trash);}
function editTask(id,sec){let it=state.items.find(x=>x.id===id)||{name:'',section:sec||(route==='section'?sub:'learn'),part:'مرن',cadence:'يومي'};modal('<h2>'+ (id?'تعديل المتابعة':'مهمة على مقاسك')+'</h2><label>الاسم<input id="tn" value="'+esc(it.name)+'"></label><div class="fieldgrid"><label>القسم<select id="ts">'+state.sections.map(s=>'<option value="'+s.id+'" '+(it.section===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label><label>وقت مرن<select id="tp">'+['صبح','بعد الظهر','بليل','مرن'].map(p=>'<option '+(it.part===p?'selected':'')+'>'+p+'</option>').join('')+'</select></label></div><label>التكرار / ملاحظة<input id="tc" value="'+esc(it.cadence)+'"></label><label class="row"><input id="tf" type="checkbox" style="width:22px" '+(it.hideFriday?'checked':'')+'> أخفيها يوم الجمعة</label><div class="actions"><button id="taskSave">حفظ</button>'+(id?'<button class="line danger" id="taskRemove">إزالة مع إمكانية الاسترجاع</button>':'')+'</div>');on('taskSave',async()=>{let n=$('tn').value.trim();if(!n)return;let v={id:id||'i'+Date.now(),name:n,section:$('ts').value,part:$('tp').value,cadence:$('tc').value,hideFriday:$('tf').checked};if(await save(s=>{if(id)s.items[s.items.findIndex(x=>x.id===id)]=v;else s.items.push(v)}))$('modal').close()});on('taskRemove',async()=>{if(await save(s=>{let i=s.items.findIndex(x=>x.id===id);s.trash.push({kind:'item',value:s.items.splice(i,1)[0],at:new Date().toISOString()})}))$('modal').close()});}
function course(n){let c=state.courses[n]||{};modal('<h2>'+esc(n)+'</h2><label>آخر درس<textarea id="cl">'+esc(c.last||'')+'</textarea></label><label>الخطوة الجاية<textarea id="cn">'+esc(c.next||'')+'</textarea></label><button id="courseSave">حفظ</button>');on('courseSave',async()=>{let v={last:$('cl').value,next:$('cn').value};if(await save(s=>s.courses[n]=v))$('modal').close()})}
function uploadDialog(kind){modal('<h2>'+({work:'أضيف عمل جديد',cover:'الغلاف',notebook:'دفتر الحفظ'}[kind])+'</h2><p class="muted">الرفع خاص بحسابك، استني رسالة نجاح قبل إغلاق النافذة.</p><form id="uform"><input name="revision" type="hidden" value="'+state.revision+'"><input name="kind" type="hidden" value="'+kind+'">'+(kind==='work'?'<label>المجموعة<select name="category">'+cats.map(c=>'<option '+((sub||cats[0])===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label><label>اسم العمل<input name="title" required maxlength="160"></label><label>ملاحظة<textarea name="note"></textarea></label>':'')+'<label>الملف<input type="file" name="file" accept="'+(kind==='notebook'?'application/pdf':'image/png,image/jpeg,image/webp')+'" required></label><button id="uploadBtn">رفع وحفظ</button><p id="upstatus" class="muted"></p></form>');$('uform').onsubmit=async e=>{e.preventDefault();if(busy||hasQuick()){toast('استني حفظ العلامات الأول');return;}setBusy(true);$('uploadBtn').disabled=true;$('upstatus').textContent='جارٍ الرفع…';try{state=await rpc('uploadAsset',$('uform'));syncLabel='محفوظ • إصدار '+state.revision;seed();$('modal').close();render();toast('اتحفظ الملف في مساحتك الخاصة');}catch(e){syncLabel='لم يتم الرفع';$('upstatus').textContent=e.message||e;$('uploadBtn').disabled=false;}finally{setBusy(false)}};}
async function openMedia(id){let a=Object.values(state.assets).concat(state.works).find(x=>x.id===id);if(!a)return;if(a.type==='application/pdf'){if(a.url){window.open(a.url,'_blank','noopener');return;}toast('جارٍ تجهيز الدفتر…');try{const m=await rpc('getMedia',id);download(m.name,m.type,m.data,true)}catch(e){toast(e.message)}return;}modal('<h2>'+esc(a.title||a.name)+'</h2><img data-media="'+id+'" alt="'+esc(a.title||a.name)+'"><p>'+esc(a.note||'')+'</p><button id="downloadArt">تنزيل نسخة</button>');hydrate();on('downloadArt',async()=>{let m=await rpc('getMedia',id);download(m.name,m.type,m.data,true)})}
function download(name,type,data,b64){let bytes=b64?Uint8Array.from(atob(data),c=>c.charCodeAt(0)):data;let u=URL.createObjectURL(new Blob([bytes],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function editWork(id){let a=state.works.find(x=>x.id===id);modal('<h2>تفاصيل العمل</h2><label>الاسم<input id="an" value="'+esc(a.title)+'"></label><label>المجموعة<select id="ac">'+cats.map(c=>'<option '+(c===a.category?'selected':'')+'>'+c+'</option>').join('')+'</select></label><label>ملاحظة<textarea id="am">'+esc(a.note||'')+'</textarea></label><button id="artSave">حفظ</button>');on('artSave',async()=>{let t=$('an').value,c=$('ac').value,n=$('am').value;if(await save(s=>{let v=s.works.find(x=>x.id===id);v.title=t;v.category=c;v.note=n}))$('modal').close()})}
function fridayDialog(){let key=weekStart();let v=state.fridays?.[key]||{};modal('<h2>الجمعة، راحة ليكي</h2><p class="muted">من غير طبخ أو تنظيف أو مشتريات. دي وقفة اختيارية، والعبادات ليها مكانها المستقل.</p><label>إيه اللي فرّحك الأسبوع ده؟<textarea id="ff">'+esc(v.happy||'')+'</textarea></label><label>إيه محتاج يتخفّف؟<textarea id="fl">'+esc(v.less||'')+'</textarea></label><label>أهم حاجة أو حاجتين للأسبوع الجاي<textarea id="fn">'+esc(v.next||'')+'</textarea></label><label>عناية بنفسي أو وقت مع جوزي، على مزاجي<textarea id="fs">'+esc(v.self||'')+'</textarea></label><button id="fridaySave">حفظ الوقفة</button>');on('fridaySave',async()=>{let v={happy:$('ff').value,less:$('fl').value,next:$('fn').value,self:$('fs').value};if(await save(s=>{s.fridays=s.fridays||{};s.fridays[key]=v}))$('modal').close()})}
function journal(){let days=Object.keys(state.days).sort().reverse();modal('<h2>يومياتي وإنجازاتي</h2>'+days.map(d=>{let x=state.days[d],n=state.items.filter(i=>i.section!=='worship'&&x.done[i.id]).length;return '<div class="card"><strong>'+esc(d)+'</strong><p>'+esc(x.note||'يوم هادي، من غير سطر مكتوب')+'</p><small>'+n+' مهام شخصية مسجلة'+(x.pages?' • '+esc(x.pages)+' صفحة قراءة':'')+'</small></div>'}).join(''));}
function manage(){modal('<h2>مساحتي على مقاسي</h2><p class="muted">تقدري تعدّلي كل مهمة من علامة القلم، وتضيفي أقسام ومهام. تعديل تصميم الشاشات نفسه من ملف المصدر، مش محرّر سحب وإفلات.</p>'+state.sections.map(s=>'<div class="task"><span class="grow">'+esc(s.name)+'</span><button class="soft" data-rename-section="'+s.id+'">تسمية</button><button class="line" data-remove-section="'+s.id+'">إزالة</button></div>').join('')+'<div class="actions"><button id="addSection">＋ قسم</button><button class="soft" id="manageAddTask">＋ مهمة</button></div><hr style="border:0;border-top:1px solid #eedde3;margin:24px 0"><h3>ملفاتي الثابتة</h3><div class="actions"><button class="line" id="coverUpload">تغيير الغلاف</button><button class="line" id="notebookUpload">استبدال الدفتر</button></div><p class="muted">تغيير الملف بيحفظ القديم في سلة الاسترجاع.</p>');document.querySelectorAll('[data-rename-section]').forEach(b=>b.onclick=async()=>{let s=state.sections.find(x=>x.id===b.dataset.renameSection),n=prompt('اسم القسم',s.name);if(n?.trim()){await save(v=>v.sections.find(x=>x.id===s.id).name=n.trim());$('modal').close()}});document.querySelectorAll('[data-remove-section]').forEach(b=>b.onclick=async()=>{if(b.dataset.removeSection==='worship'){toast('قسم العبادات مستقل. تقدري تعدّلي متابعاته من داخله.');return;}if(!confirm('ننقل القسم ومهامه لسلة الاسترجاع؟'))return;await save(s=>{let i=s.sections.findIndex(x=>x.id===b.dataset.removeSection);let section=s.sections.splice(i,1)[0];let items=s.items.filter(x=>x.section===section.id);s.items=s.items.filter(x=>x.section!==section.id);s.trash.push({kind:'section',value:{...section,items},at:new Date().toISOString()})});$('modal').close()});on('addSection',async()=>{let n=prompt('اسم القسم الجديد');if(n?.trim()){await save(s=>s.sections.push({id:'s'+Date.now(),name:n.trim(),icon:'flower'}));$('modal').close()}});on('manageAddTask',()=>{$('modal').close();editTask()});on('coverUpload',()=>{$('modal').close();uploadDialog('cover')});on('notebookUpload',()=>{$('modal').close();uploadDialog('notebook')});}
function trash(){modal('<h2>سلة الاسترجاع</h2><p class="muted">مفيش حذف نهائي تلقائي.</p>'+state.trash.map((x,i)=>'<div class="task"><span class="grow">'+esc(x.value.title||x.value.name||'عنصر')+'</span><button class="soft" data-restore="'+i+'">استرجاع</button></div>').join(''));document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{await save(s=>{let x=s.trash.splice(+b.dataset.restore,1)[0];if(x.kind==='section'){let v=x.value;s.sections.push({id:v.id,name:v.name,icon:v.icon});s.items.push(...v.items);}if(x.kind==='item')s.items.push(x.value);if(x.kind==='work')s.works.push(x.value);if(x.kind==='asset')s.works.push({...x.value,title:x.value.name,category:cats[0]})});$('modal').close()})}
function backup(){modal('<h2>نسختك الاحتياطية</h2><p>التصدير بيجمع بياناتك والصور والدفتر في ملف JSON خاص. الملف ممكن يكون كبير وفيه معلوماتك، احتفظي بيه في مكان آمن.</p><p class="muted">التصدير هنا من حسابك لجهازك، مش مشاركة. والاسترجاع السريع يرجع آخر تعديل صغير فقط، مش بديل للتصدير.</p><div class="actions"><button id="exportAll">تصدير كل البيانات والملفات</button><button class="line" id="exportText">تصدير البيانات فقط</button><button class="line" id="undoLast">تراجع عن آخر تعديل صغير</button></div><label>استرجاع ملف بيانات لنفس الحساب<input id="restoreFile" type="file" accept="application/json"></label><button class="line" id="restoreFileBtn">استرجاع ملفي</button><p class="muted">استرجاع «تصدير كل البيانات والملفات» بيرجع البيانات والصور والدفتر اللي اتخزنت في الملف. «تصدير البيانات فقط» بيرجع البيانات من غير الصور.</p><p id="backupStatus" class="muted"></p>');on('restoreFileBtn',async()=>{if(busy||hasQuick())return;let f=$('restoreFile').files[0];if(!f)return;try{let data=JSON.parse(await f.text());let restored=data.state||data;if(restored.version!==1||!Array.isArray(restored.items)||!Array.isArray(restored.sections)||!restored.days)throw new Error('ده مش ملف بيانات مريم.');if(!confirm('الاسترجاع هيستبدل البيانات الحالية، صدّري نسخة منها الأول. نكمل؟'))return;if(data.media){for(const [mid,mm] of Object.entries(data.media)){const bin=atob(mm.data),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await kv('put','media:'+mid,{name:mm.name,type:mm.type,blob:new Blob([u],{type:mm.type})})}}let rev=state.revision;restored.revision=rev;setBusy(true);state=await rpc('saveApp',rev,restored);syncLabel='محفوظ • إصدار '+state.revision;$('modal').close();render();toast('اترجعت البيانات')}catch(e){syncLabel='لم يتم الاسترجاع';toast(e.message)}finally{setBusy(false)}});on('exportText',()=>{if(hasQuick()){toast('استني حفظ العلامات قبل التصدير');return;}kv('put','lastBackup',Date.now());download('mariam-data-'+date+'.json','application/json',JSON.stringify(state,null,2))});on('exportAll',async()=>{if(busy||hasQuick()){toast('استني حفظ العلامات قبل التصدير');return;}$('exportAll').disabled=true;$('backupStatus').textContent='جارٍ جمع الملفات، سيبدأ التنزيل لما يجهز…';try{const b=await rpc('exportApp');download('mariam-full-backup-'+date+'.json','application/json',JSON.stringify(b));$('backupStatus').textContent='تم تجهيز النسخة وطلب تنزيلها. راجعي التنزيلات.'}catch(e){$('backupStatus').textContent=e.message||e}finally{$('exportAll').disabled=false}});on('undoLast',async()=>{if(busy||hasQuick())return;if(!confirm('نرجع آخر تعديل محفوظ؟ اعملي تصدير الأول لو محتاجة النسخة الحالية.'))return;try{setBusy(true);state=await rpc('restorePrevious',state.revision);syncLabel='محفوظ • إصدار '+state.revision;$('modal').close();render();toast('اترجع آخر تعديل')}catch(e){syncLabel='لم يتم التراجع';toast(e.message)}finally{setBusy(false)}})}
let quickPending={},quickSaving=false,quickFailed=false,quickTimer=null;
function quickKey(p){return p.kind==='plan'?'plan:'+p.id:'day:'+p.date+':'+p.id}
function applyQuick(s,p){if(p.kind==='plan'){s.quran=s.quran||{};s.quran[p.id]=p.value;}else{let d=s.days[p.date]||(s.days[p.date]={done:{},note:'',friday:{},pages:''});d.done[p.id]=p.value;}}
function hasQuick(){return quickSaving||Object.keys(quickPending).length>0;}
function quickStatus(){let pending=hasQuick();$('sync').textContent=quickFailed?'لم يتم الحفظ':pending?'جارٍ حفظ العلامات…':syncLabel;$('retryQuick').hidden=!quickFailed;$('discardQuick').hidden=!quickFailed;}
function quickToggle(kind,id){if(busy){toast('استني الحفظ الحالي يخلص');return;}let p={kind,id,date,value:kind==='plan'?!state.quran?.[id]:!day().done[id]};applyQuick(state,p);quickPending[quickKey(p)]=p;let y=window.scrollY;render();window.scrollTo(0,y);quickStatus();if(!quickSaving&&!quickFailed){clearTimeout(quickTimer);quickTimer=setTimeout(flushQuick,180);}}
async function flushQuick(){if(quickSaving||quickFailed||!Object.keys(quickPending).length)return;quickSaving=true;let batch=quickPending;quickPending={};let snapshot=JSON.parse(JSON.stringify(state));let rev=state.revision;quickStatus();try{let saved=await rpc('saveApp',rev,snapshot);state=saved;Object.values(quickPending).forEach(p=>applyQuick(state,p));syncLabel='محفوظ • إصدار '+state.revision;}catch(e){quickPending={...batch,...quickPending};quickFailed=true;toast('العلامات ظاهرة هنا لكن لم يتأكد حفظها. اختاري إعادة المحاولة أو قراءة آخر نسخة.');}finally{quickSaving=false;quickStatus();if(!quickFailed&&Object.keys(quickPending).length)flushQuick();}}
async function retryQuick(){if(quickSaving||busy)return;busy=true;try{let latest=await rpc('getApp');Object.values(quickPending).forEach(p=>applyQuick(latest,p));state=latest;quickFailed=false;render();}catch(e){toast('تعذّر الاتصال. العلامات لسه منتظرة هنا.');}finally{busy=false;quickStatus();if(!quickFailed)flushQuick();}}
async function discardQuick(){if(!confirm('نقرأ آخر نسخة محفوظة ونلغي العلامات اللي لم يتأكد حفظها في الصفحة دي؟'))return;quickPending={};quickFailed=false;await load();quickStatus();}
window.addEventListener('beforeunload',e=>{if(hasQuick()||busy){e.preventDefault();e.returnValue='';}});

$('retryQuick').onclick=retryQuick;$('discardQuick').onclick=discardQuick;$('refresh').onclick=load;load();


/* backup reminder: shown when no export in 3 days; this is a manual save, nothing is uploaded automatically */
(async()=>{try{const t=await kv('get','lastBackup');const old=!t||Date.now()-t>3*864e5;if(old){const b=document.createElement('div');b.id='bk';b.style.cssText='background:#fff1f5;border-bottom:1px solid #eedde3;padding:8px 24px;font-size:14px;color:#8c4765;text-align:center';b.innerHTML='بياناتك على جوالك بس. احفظي نسخة احتياطية (مساحتي ← نسختك الاحتياطية) وخزنيها في Files أو iCloud.';document.querySelector('header').after(b)}if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
