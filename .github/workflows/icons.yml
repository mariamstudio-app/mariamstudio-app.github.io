name: icons
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/icons.yml
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p icons
          echo '' | base64 -d > /tmp/icon.jpg
          pip install pillow
          python3 -c "from PIL import Image; im=Image.open('/tmp/icon.jpg').convert('RGB'); im.save('icons/icon-512.png'); im.resize((192,192),Image.LANCZOS).save('icons/icon-192.png'); im.resize((180,180),Image.LANCZOS).save('icons/icon-180.png')"
          cp icons/icon-512.png icons/icon-maskable.png
          git config user.name mariamstudio-app
          git config user.email mariamreda.work+mariam@gmail.com
          git add icons
          git commit -m "Update app icons" || true
          git push
